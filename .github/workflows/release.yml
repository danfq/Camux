name: Release

on:
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: version
        name: Bump package version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "Release workflow must be dispatched from a branch" >&2
            exit 1
          fi

          backend_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' core/backend/Cargo.toml | head -n 1)
          frontend_version=$(jq -r '.version' core/app/package.json)
          bundle_version=$(jq -r '.version' core/backend/tauri.conf.json)
          if [[ "$backend_version" != "$frontend_version" || "$backend_version" != "$bundle_version" ]]; then
            echo "Frontend, backend, and bundle versions must match before releasing" >&2
            exit 1
          fi
          if [[ ! "$backend_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Package version is not a stable semantic version: $backend_version" >&2
            exit 1
          fi

          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}

          commit_subject=$(git log -1 --format=%s)
          commit_message=$(git log -1 --format=%B)
          breaking_subject_re='^[[:alnum:]_-]+(\([^)]*\))?!:'
          feature_subject_re='^feat(\([^)]*\))?:'
          if [[ "$commit_subject" =~ $breaking_subject_re ]] || grep -Eq '^BREAKING[ -]CHANGE:' <<< "$commit_message"; then
            bump=major
          elif [[ "$commit_subject" =~ $feature_subject_re ]]; then
            bump=minor
          else
            bump=patch
          fi

          previous_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            if ! git rev-parse --verify --quiet "refs/tags/$previous_tag" >/dev/null; then
              echo "Latest release tag $previous_tag is missing from the checkout" >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$previous_tag" HEAD; then
              echo "Latest release $previous_tag is not an ancestor of this branch" >&2
              exit 1
            fi
            changelog_range="$previous_tag..HEAD"
            if [[ $(git rev-list --count "$changelog_range") -eq 0 ]]; then
              echo "There are no changes since $previous_tag" >&2
              exit 1
            fi
          else
            changelog_range=HEAD
          fi

          {
            echo "## Changes"
            echo
            git log --first-parent "$changelog_range" --pretty=format:'- %s (%h)'
            echo
          } > "$RUNNER_TEMP/release-notes.md"

          case "$bump" in
            patch) version="$major.$minor.$((patch + 1))" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            major) version="$((major + 1)).0.0" ;;
          esac

          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$version\"/" core/backend/Cargo.toml
          sed -i -E "/^name = \"camux\"$/,/^$/s/^version = \"[^\"]+\"/version = \"$version\"/" core/backend/Cargo.lock
          jq --arg version "$version" '.version = $version' core/backend/tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp core/backend/tauri.conf.json
          jq --arg version "$version" '.version = $version' core/app/package.json > package.json.tmp
          mv package.json.tmp core/app/package.json

          git diff --check
          changed=$(git diff --name-only)
          expected=$'core/app/package.json\ncore/backend/Cargo.lock\ncore/backend/Cargo.toml\ncore/backend/tauri.conf.json'
          if [[ "$changed" != "$expected" ]]; then
            echo "Version bump changed an unexpected set of files:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          tag="v$version"
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/app/package.json core/backend/Cargo.toml core/backend/Cargo.lock core/backend/tauri.conf.json
          git commit -m "chore: bump version to $version [skip ci]"
          git tag -a "$tag" -m "Camux $version"
          git push --atomic origin "HEAD:refs/heads/$GITHUB_REF_NAME" "refs/tags/$tag"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Selected a $bump bump from: $commit_subject"

      - name: Store release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  build:
    needs: bump
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust-targets: ""
          - name: windows-x86_64
            os: windows-latest
            args: ""
            rust-targets: ""
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libv4l-dev patchelf xdg-utils

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install frontend dependencies
        working-directory: core/app
        run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: core/backend -> target

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: core/backend
          tauriScript: ../app/node_modules/.bin/tauri
          retryAttempts: 2
          uploadUpdaterJson: false
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: release-[platform]-[arch]-[bundle]
          args: ${{ matrix.args }}

  build-arch-package:
    name: Build Arch package
    needs: bump
    runs-on: ubuntu-22.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Install Arch build dependencies
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          pacman -Syu --noconfirm
          export CAMUX_VERSION="$VERSION"
          source packaging/arch/PKGBUILD
          pacman -S --needed --noconfirm "${depends[@]}" "${makedepends[@]}"

      - name: Install frontend dependencies
        working-directory: core/app
        run: bun install --frozen-lockfile

      - name: Build frontend
        working-directory: core/app
        run: bun run build

      - name: Build application
        working-directory: core/backend
        run: cargo build --release

      - name: Create pacman package
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          package_dir="$RUNNER_TEMP/camux-arch-package"
          mkdir -p "$package_dir/artifacts"
          cp packaging/arch/PKGBUILD "$package_dir/"
          cp packaging/arch/camux.desktop "$package_dir/artifacts/"
          cp assets/logo.png "$package_dir/artifacts/camux.png"
          cp core/backend/target/release/camux "$package_dir/artifacts/"
          cp -a vendor/v4l2loopback "$package_dir/artifacts/"
          useradd --create-home builder
          chown -R builder:builder "$package_dir"
          su builder -c "cd '$package_dir' && CAMUX_VERSION='$VERSION' makepkg --syncdeps --cleanbuild --noconfirm"
          mv "$package_dir/camux-$VERSION-1-x86_64.pkg.tar.zst" "$RUNNER_TEMP/Camux-$VERSION-linux-x86_64.pkg.tar.zst"

      - name: Store Arch package
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64-arch
          path: ${{ runner.temp }}/Camux-${{ needs.bump.outputs.version }}-linux-x86_64.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish release
    needs:
      - bump
      - build
      - build-arch-package
    runs-on: ubuntu-22.04
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-*-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Create published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.bump.outputs.version }}
          TITLE: Camux ${{ needs.bump.outputs.version }}
          VERSION: ${{ needs.bump.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          shopt -s nullglob
          assets=("$ASSET_DIR"/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi

          for asset in "${assets[@]}"; do
            case "$asset" in
              *.AppImage) target="Camux-$VERSION-linux-x86_64.AppImage" ;;
              *.deb) target="Camux-$VERSION-linux-x86_64.deb" ;;
              *.rpm) target="Camux-$VERSION-linux-x86_64.rpm" ;;
              *.dmg) target="Camux-$VERSION-macos-universal.dmg" ;;
              *.msi) target="Camux-$VERSION-windows-x86_64.msi" ;;
              *.exe) target="Camux-$VERSION-windows-x86_64-setup.exe" ;;
              *.pkg.tar.zst) continue ;;
              *)
                echo "Unexpected release asset: $asset" >&2
                exit 1
                ;;
            esac
            if [[ "$asset" != "$ASSET_DIR/$target" ]]; then
              mv "$asset" "$ASSET_DIR/$target"
            fi
          done

          assets=("$ASSET_DIR"/*)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE"
